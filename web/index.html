<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FS3-P Foot Pedals</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e252d; --line:#2a333d;
    --txt:#e8edf2; --dim:#8b98a5; --acc:#4cc2ff; --ok:#41d693;
    --warn:#f5a623; --err:#ff6b6b; --chip:#232c35;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    padding:14px 14px 40px;
    -webkit-tap-highlight-color:transparent;
  }
  h1{font-size:18px;margin:2px 0 2px;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .sub code{background:var(--panel);padding:1px 5px;border-radius:4px;color:var(--acc)}

  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:13px 14px; margin-bottom:13px;
  }

  /* live feed */
  #feedwrap .row{display:flex;gap:10px;align-items:center}
  #flash{
    flex:1; min-height:44px; display:flex; align-items:center;
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:0 12px; font-size:15px; color:var(--dim); transition:background .12s,color .12s,transform .06s;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  #flash.hot{background:rgba(76,194,255,.14); border-color:var(--acc); color:#fff; transform:scale(1.012)}
  #flash .kbd{
    display:inline-block; background:#0b0e11; border:1px solid var(--line);
    border-bottom-width:2px; border-radius:6px; padding:2px 9px; margin:0 3px;
    font-weight:600; color:var(--acc);
  }
  #log{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;min-height:22px}
  .pill{
    background:var(--chip); border:1px solid var(--line); border-radius:20px;
    padding:2px 10px; font-size:12px; color:var(--txt);
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  .stat{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:5px;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .dot.off{background:var(--err)}

  /* pedal card */
  .pedal-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .pedal-num{
    width:30px;height:30px;border-radius:8px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#274,#123);
    background:linear-gradient(160deg,#2a3a48,#1c252e);
    border:1px solid var(--line); font-weight:700; font-size:15px; color:var(--acc);
  }
  .pedal-cur{flex:1;font-size:13px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pedal-cur b{color:var(--dim);font-weight:500}

  .modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .mode{
    background:var(--chip); border:1px solid var(--line); color:var(--dim);
    border-radius:8px; padding:6px 11px; font-size:13px; cursor:pointer;
  }
  .mode.active{background:rgba(76,194,255,.16); border-color:var(--acc); color:var(--txt); font-weight:600}

  .field{margin-bottom:11px}
  .label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    background:var(--chip); border:1px solid var(--line); color:var(--txt);
    border-radius:7px; padding:5px 10px; font-size:13px; cursor:pointer; min-width:34px; text-align:center;
  }
  .chip.on{background:rgba(65,214,147,.16); border-color:var(--ok); color:#fff; font-weight:600}
  select{
    width:100%; background:var(--chip); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font-size:14px;
  }
  input[type=text],input[type=number]{
    width:100%; background:var(--chip); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font-size:14px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

  .actions{display:flex;gap:9px;margin-top:13px;align-items:center}
  .btn{
    background:var(--acc); border:none; color:#04121c; border-radius:9px;
    padding:10px 18px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .btn.ghost{background:var(--chip);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .btn:active{transform:translateY(1px)}
  .result{font-size:13px;margin-top:10px;min-height:18px}
  .result.ok{color:var(--ok)} .result.err{color:var(--err)}
  .spec-out{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--dim);margin-top:6px}
  .spec-out b{color:var(--acc);font-weight:600}

  .hidden{display:none!important}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:11px}
  .bar .grow{flex:1}
  .errbox{background:rgba(255,107,107,.1);border:1px solid var(--err);border-radius:9px;padding:9px 12px;font-size:13.5px;color:#ffd7d7;margin-bottom:12px}
</style>
</head>
<body>
  <h1>FS3-P Foot Pedals</h1>
  <div class="sub">Programming the PCsensor FS3-P <code>1a86:e026</code> &middot; settings are saved to the pedal's flash</div>

  <div class="card" id="feedwrap">
    <div class="row">
      <div>
        <div class="stat"><span class="dot" id="feeddot"></span>live key feed</div>
      </div>
      <div id="flash">stomp a pedal…</div>
    </div>
    <div id="log"></div>
  </div>

  <div id="pedals"></div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

let META = {keys:[],mods:[],buttons:[]};
const PEDALS = [1,2,3];

// ---------- meta + initial state ----------
async function loadMeta(){
  const r = await fetch("/api/meta");
  META = await r.json();
}

// ---------- live feed ----------
let feedOpen = false;
function setupFeed(){
  const flash = $("#flash"), log = $("#log"), dot = $("#feeddot");
  function addPill(text){
    const p = document.createElement("span");
    p.className = "pill"; p.textContent = text;
    log.prepend(p);
    while (log.children.length > 14) log.lastChild.remove();
  }
  const es = new EventSource("/api/events");
  es.onopen = () => { feedOpen = !dot.classList.contains("off"); };
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.error){
      dot.className = "dot off";
      flash.textContent = "feed: " + ev.error;
      flash.className = "";
      return;
    }
    dot.className = "dot on"; feedOpen = true;
    flash.className = "hot";
    flash.innerHTML = `<span class="kbd">${ev.key}</span> ${ev.down ? "press" : "release"}`;
    addPill(ev.key);
    clearTimeout(addPill._t);
    addPill._t = setTimeout(()=>{ flash.className=""; }, 450);
  };
  es.onerror = () => { dot.className = "dot off"; feedOpen = false; };
}

// ---------- spec building / parsing ----------
// pedal editor state: {mode, mods:Set, key, button, haveX,X,haveY,Y,haveW,W, str}
function emptyEditor(){
  return {mode:"none", mods:new Set(), key:"", button:"",
          haveX:false,X:0,haveY:false,Y:0,haveW:false,W:0, str:""};
}

function buildSpec(ed){
  if (ed.mode === "none") return "none";
  if (ed.mode === "string"){
    return "str:" + ed.str.trim();
  }
  const parts = [];
  const keybits = [];
  ed.mods.forEach(m => keybits.push(m));
  if (ed.key) keybits.push(ed.key);
  if (keybits.length) parts.push(keybits.join("+"));
  const mousebits = [];
  if (ed.button) mousebits.push(ed.button);
  if (ed.haveX) mousebits.push("x:" + ed.X);
  if (ed.haveY) mousebits.push("y:" + ed.Y);
  if (ed.haveW) mousebits.push("w:" + ed.W);
  if (mousebits.length) parts.push(mousebits.join(" "));
  return parts.join(" ") || "none";
}

// map a state.pedals entry into an editor object (for prefill)
function stateToEditor(p){
  const ed = emptyEditor();
  if (!p || p.type === "none") return ed;
  if (p.type === "string"){ ed.mode = "string"; ed.str = p.string || ""; return ed; }
  if (p.type === "key"){
    ed.mode = "key";
    (p.mods||[]).forEach(m=>ed.mods.add(m));
    ed.key = p.key || "";
    return ed;
  }
  if (p.type === "mouse"){
    ed.mode = "mouse";
    ed.button = p.button || "";
    if (p.x) {ed.haveX=true; ed.X=p.x;}
    if (p.y) {ed.haveY=true; ed.Y=p.y;}
    if (p.w) {ed.haveW=true; ed.W=p.w;}
    return ed;
  }
  if (p.type === "key+mouse"){
    ed.mode = "key+mouse";
    (p.mods||[]).forEach(m=>ed.mods.add(m));
    ed.key = p.key || "";
    ed.button = p.button || "";
    if (p.x) {ed.haveX=true; ed.X=p.x;}
    if (p.y) {ed.haveY=true; ed.Y=p.y;}
    if (p.w) {ed.haveW=true; ed.W=p.w;}
    return ed;
  }
  return ed;
}

function prettyType(p){
  if (!p) return "—";
  if (p.type === "none") return "unconfigured";
  if (p.type === "string") return "types “" + (p.string||"") + "”";
  const bits = [];
  (p.mods||[]).forEach(m=>bits.push(m));
  if (p.key) bits.push(p.key);
  if (p.button) bits.push(p.button);
  if (p.x) bits.push("x"+p.x); if (p.y) bits.push("y"+p.y); if (p.w) bits.push("w"+p.w);
  return bits.join(" + ") || "—";
}

// ---------- pedal cards ----------
function renderPedals(current){
  const host = $("#pedals");
  host.innerHTML = "";
  PEDALS.forEach(n => {
    const p = current && current.pedals ? current.pedals.find(x=>x.n===n) : null;
    const ed = stateToEditor(p);
    host.appendChild(makeCard(n, p, ed));
  });
}

function makeCard(n, currentState, ed){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="pedal-head">
      <div class="pedal-num">${n}</div>
      <div class="pedal-cur" data-cur>currently: <b>${prettyType(currentState)}</b></div>
    </div>
    <div class="modes" data-modes>
      <button class="mode" data-m="key">key</button>
      <button class="mode" data-m="mouse">mouse</button>
      <button class="mode" data-m="key+mouse">key+mouse</button>
      <button class="mode" data-m="string">string</button>
      <button class="mode" data-m="none">clear</button>
    </div>

    <div data-keysec>
      <div class="field">
        <span class="label">modifiers</span>
        <div class="chips" data-mods></div>
      </div>
      <div class="field">
        <label class="label">key</label>
        <select data-key><option value="">(none — modifiers only)</option></select>
      </div>
    </div>

    <div data-mousesec class="hidden">
      <div class="field">
        <label class="label">button</label>
        <select data-button><option value="">(none)</option></select>
      </div>
      <div class="field">
        <span class="label">relative move</span>
        <div class="grid3">
          <div><input type="number" data-x placeholder="x" min="-128" max="127"></div>
          <div><input type="number" data-y placeholder="y" min="-128" max="127"></div>
          <div><input type="number" data-w placeholder="wheel" min="-128" max="127"></div>
        </div>
      </div>
    </div>

    <div data-strsec class="hidden">
      <div class="field">
        <label class="label">string to type (max 38 chars)</label>
        <input type="text" data-str maxlength="38" placeholder="hello world">
      </div>
    </div>

    <div class="actions">
      <button class="btn" data-apply>Apply to pedal ${n}</button>
      <button class="btn ghost" data-clear>reset</button>
      <div class="grow"></div>
      <span class="stat" data-st></span>
    </div>
    <div class="spec-out" data-spec></div>
    <div class="result" data-res></div>
  `;

  // fill selects
  const keySel = $('[data-key]', card);
  META.keys.forEach(k => { const o=document.createElement("option"); o.value=k; o.textContent=k; keySel.appendChild(o); });
  const btnSel = $('[data-button]', card);
  META.buttons.forEach(b => { const o=document.createElement("option"); o.value=b; o.textContent=b; btnSel.appendChild(o); });

  // modifiers chips
  const modsHost = $('[data-mods]', card);
  META.mods.forEach(m => {
    const c = document.createElement("button");
    c.className = "chip" + (ed.mods.has(m) ? " on" : "");
    c.textContent = m.replace("l_","").replace("r_","r");
    c.title = m;
    c.onclick = () => {
      if (ed.mods.has(m)) ed.mods.delete(m); else ed.mods.add(m);
      c.classList.toggle("on");
      syncSpec(card, ed);
    };
    modsHost.appendChild(c);
  });

  // prefill
  keySel.value = ed.key || "";
  btnSel.value = ed.button || "";
  $('[data-x]',card).value = ed.haveX ? ed.X : "";
  $('[data-y]',card).value = ed.haveY ? ed.Y : "";
  $('[data-w]',card).value = ed.haveW ? ed.W : "";
  $('[data-str]',card).value = ed.str || "";

  // mode switching
  function setMode(m){
    ed.mode = m;
    $$('.mode', card).forEach(b => b.classList.toggle("active", b.dataset.m === m));
    const wantKey = (m==="key" || m==="key+mouse");
    const wantMouse = (m==="mouse" || m==="key+mouse");
    $('[data-keysec]',card).classList.toggle("hidden", !wantKey);
    $('[data-mousesec]',card).classList.toggle("hidden", !wantMouse);
    $('[data-strsec]',card).classList.toggle("hidden", m!=="string");
    // for mouse-only mode, drop key from spec; for key+mouse keep both
    syncSpec(card, ed);
  }
  $$('.mode', card).forEach(b => b.onclick = () => setMode(b.dataset.m));

  // live inputs
  keySel.onchange = () => { ed.key = keySel.value; syncSpec(card, ed); };
  btnSel.onchange = () => { ed.button = btnSel.value; syncSpec(card, ed); };
  for (const [sel, key] of [["[data-x]","X"],["[data-y]","Y"],["[data-w]","W"]]){
    $(sel, card).oninput = (e) => {
      const v = e.target.value;
      const have = v !== "";
      const num = have ? parseInt(v,10) : 0;
      ed["have"+key] = have;
      ed[key] = have ? (Math.max(-128, Math.min(127, num))) : 0;
      syncSpec(card, ed);
    };
  }
  $('[data-str]',card).oninput = (e) => { ed.str = e.target.value; syncSpec(card, ed); };

  $('[data-clear]', card).onclick = () => {
    ed.mods.clear(); ed.key=""; ed.button="";
    ed.haveX=ed.haveY=ed.haveW=false; ed.X=ed.Y=ed.W=0; ed.str="";
    $$('.chip', card).forEach(c=>c.classList.remove("on"));
    keySel.value=""; btnSel.value="";
    $('[data-x]',card).value=""; $('[data-y]',card).value=""; $('[data-w]',card).value="";
    $('[data-str]',card).value="";
    setMode("none");
  };

  function syncSpec(card, ed){
    const spec = buildSpec(ed);
    $('[data-spec]', card).innerHTML = 'will write: <b>' + escapeHtml(spec) + '</b>';
  }

  $('[data-apply]', card).onclick = async () => {
    const spec = buildSpec(ed);
    const resEl = $('[data-res]', card);
    const stEl = $('[data-st]', card);
    if (spec === "none"){
      if (!confirm("Clear pedal " + n + " (unconfigure it)?")) return;
    }
    resEl.className = "result"; resEl.textContent = "";
    stEl.textContent = "writing…"; stEl.style.color = "var(--warn)";
    let r;
    try {
      r = await fetch("/api/apply", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({pedal:n, spec})});
    } catch (e) {
      stEl.textContent = ""; resEl.className="result err"; resEl.textContent = "network error: "+e; return;
    }
    const body = await r.json().catch(()=>({error:"bad response"}));
    if (r.ok && body.ok){
      stEl.textContent = "saved"; stEl.style.color = "var(--ok)";
      resEl.className = "result ok";
      resEl.textContent = "written to pedal " + n + (body.readback_ok ? " · read-back OK" : " · ⚠ read-back mismatch");
      // refresh current label
      const st = await refreshState();
      if (st && st.state) {
        const np = st.state.pedals.find(x=>x.n===n);
        $('[data-cur]', card).innerHTML = 'currently: <b>' + escapeHtml(prettyType(np)) + '</b>';
      }
    } else {
      stEl.textContent = "error"; stEl.style.color = "var(--err)";
      resEl.className = "result err";
      resEl.textContent = body.error || ("failed (stage: " + (body.stage||"?") + ")");
    }
  };

  setMode(ed.mode);
  return card;
}

function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}

let STATE = null;
async function refreshState(){
  try {
    const r = await fetch("/api/state");
    const body = await r.json();
    if (body.state) { STATE = body; }
    return body;
  } catch { return null; }
}

// ---------- boot ----------
(async function(){
  await loadMeta();
  const st = await refreshState();
  if (!st || st.error){
    const box = document.createElement("div");
    box.className = "errbox";
    box.textContent = (st && st.error) ? st.error : "could not read pedal state";
    $("#pedals").insertAdjacentElement("afterend", box);
  }
  renderPedals(st && st.state ? st.state : null);
  setupFeed();
})();
</script>
</body>
</html>
